name: Deploy on Production Server

on:
  workflow_dispatch:
  pull_request:
    branches: ["release"]
    types: ["closed"]
    paths:
      - "packages/client/**"
      - ".github/workflows/deploy-client.yml"

env:
  API_BASE_URL: https://api.knud2024.com/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn Berry Cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
            .yarn/install-state.gz
            .pnp.cjs
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Production
        run: yarn workspace @knud2024/client build
        env:
          VITE_API_BASE_URL: ${{env.API_BASE_URL}}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-southeast-2

      - name: Upload to AWS S3
        env:
          BUCKET_NAME: ${{secrets.AWS_BUCKET_NAME}}
        run: aws s3 sync ./packages/client/dist s3://$BUCKET_NAME --delete

      - name: Invalidate AWS Cloudfront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{secrets.AWS_CLOUDFRONT_ID}} --paths /*
