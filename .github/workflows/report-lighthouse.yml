name: Report Lighthouse to S3

on:
    workflow_dispatch:

jobs:
    report:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v2
              with:
                  node-version: 22

            - name: Setup yarn package manager
              run: npm install -g yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build Production
              run: yarn run build

            - name: Create Lighthouse Report
              run: yarn run lighthouse

            - name: Summarize Lighthouse Report
              run: yarn run lighthouse:summary

            - name: Upload Report to S3
              run: yarn run lighthouse:save
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  REPORT_BUCKET: ${{ secrets.REPORT_BUCKET }}
